name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable Gradle caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Android SDK
        # android-actions/setup-android is not used here. It is deprecated and its internal
        # `sdkmanager tools` call exits 1 on current runner images, which failed the job before
        # any build step ran. GitHub-hosted runners already ship the SDK and cmdline-tools, so
        # all that is needed is to accept the licenses and put the existing tools on PATH.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, lint and run unit tests
        run: ./gradlew --no-daemon assembleDebug lint testDebugUnitTest

      - name: Verify schema version stayed frozen at 4
        # Six regression scripts assert DB_VERSION = 4. A schema bump must be a deliberate,
        # reviewed change rather than an accident, so fail CI if it drifts.
        run: |
          grep -qE 'DB_VERSION\s*=\s*4' app/src/main/java/cn/suizhang/ledger/LedgerDatabase.java
          ! grep -q 'oldVersion < 5' app/src/main/java/cn/suizhang/ledger/LedgerDatabase.java

      - name: Run source-level regression scripts
        # The Python scripts cover parsing, privacy and layout invariants that JUnit cannot reach.
        # Failures are fatal on purpose: with continue-on-error a silently broken script looks
        # identical to a passing one, which is how three of these went unrun for weeks.
        # Scripts needing an external fixture report SKIP and exit 0, so they do not block.
        run: |
          failed=0
          for f in scripts/test-*.py; do
            echo "::group::$f"
            if ! python3 "$f"; then
              echo "::error::$f failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7