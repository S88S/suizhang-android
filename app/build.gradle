plugins {
    id 'com.android.application'
}

// Release signing reads from keystore.properties, which is git-ignored. Without it the release
// build still works and produces app-release-unsigned.apk, so a fresh clone is never blocked.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'cn.suizhang.ledger'
    compileSdk 36

    defaultConfig {
        applicationId 'cn.suizhang.ledger'
        minSdk 29
        targetSdk 34
        versionCode 23
        versionName '1.4.9'
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey("storeFile")) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':HiMiuix')
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
}
